import fs from "fs";
import fetch from "node-fetch";
import cheerio from "cheerio";

const BASE = "https://belitungkab.bps.go.id";
const START = BASE + "/id/publication";

async function fetchHTML(url) {
  const res = await fetch(url, { timeout: 30000 });
  return await res.text();
}

async function run() {
  const index = [];

  // 1️⃣ ambil halaman daftar publikasi
  const html = await fetchHTML(START);
  const $ = cheerio.load(html);

  const detailPages = new Set();

  $("a[href*='/id/publication/']").each((_, el) => {
    const href = $(el).attr("href");
    if (href && href.endsWith(".html")) {
      detailPages.add(href.startsWith("http") ? href : BASE + href);
    }
  });

  console.log("Detail pages ditemukan:", detailPages.size);

  // 2️⃣ masuk ke halaman detail → ambil PDF
  for (const page of detailPages) {
    try {
      const detailHTML = await fetchHTML(page);
      const d = cheerio.load(detailHTML);

      const title =
        d("h1").first().text().trim() ||
        d("meta[property='og:title']").attr("content");

      const pdf = d("a[href$='.pdf']").attr("href");

      if (pdf) {
        index.push({
          title,
          url: pdf.startsWith("http") ? pdf : BASE + pdf
        });
      }
    } catch (e) {
      console.log("Skip:", page);
    }
  }

  fs.writeFileSync(
    "data/index.json",
    JSON.stringify(index, null, 2),
    "utf-8"
  );

  console.log("TOTAL PDF:", index.length);
}

run();
