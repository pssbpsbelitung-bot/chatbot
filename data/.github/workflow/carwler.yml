name: Update Index Publikasi BPS

on:
  schedule:
    - cron: "0 2 * * 0" # Minggu jam 02.00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run crawler
        run: node crawler.js

      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/index.json
          git commit -m "Auto update index publikasi" || echo "Tidak ada perubahan"
          git push
