name: Crawl PDF BPS Belitung

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Run crawler
      run: node crawler.js

    - name: Commit hasil
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add data/index.json
        git commit -m "Update index PDF" || echo "No changes"
        git push
